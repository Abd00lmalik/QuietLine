server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        set $relayer_upstream http://relayer:8787;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $relayer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        set $tee_proxy_upstream http://tee-proxy:6664;
        proxy_pass $tee_proxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
