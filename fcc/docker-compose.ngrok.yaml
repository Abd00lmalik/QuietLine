services:
  relayer:
    image: quietline-relayer:v0.1.0
    restart: unless-stopped
    env_file:
      - ../relayer/.env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/relayer.db
      FCC_PROXY_URL: http://tee-proxy:6664
    volumes:
      - quietline-relayer-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - tee-proxy

  public-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - relayer
      - tee-proxy

  ngrok-fcc:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required in the root .env}
    command:
      - http
      - --url=${NGROK_DOMAIN:?NGROK_DOMAIN is required}
      - http://public-gateway:8080
    depends_on:
      - public-gateway

volumes:
  quietline-relayer-data:
